[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "panelmed"
version         = "0.1.1"
description     = "Causal mediation analysis for panel data with double/debiased machine learning (DML-GMM)"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "MIT" }
authors         = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
maintainers     = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
keywords        = ["econometrics", "causal mediation", "panel data", "double machine learning",
                   "GMM", "fixed effects", "direct and indirect effects"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "pandas>=1.4",
  "matplotlib>=3.5",
  "scikit-learn>=1.1",
  "joblib>=1.2",
]

[project.optional-dependencies]
plotly = ["plotly>=5.0"]
dev    = ["pytest>=7", "pytest-cov", "build", "twine", "ruff"]

[project.urls]
Homepage      = "https://merwanroudane.github.io/panelmed/"
Repository    = "https://github.com/merwanroudane/panelmed"
Documentation = "https://merwanroudane.github.io/panelmed/"
Issues        = "https://github.com/merwanroudane/panelmed/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/panelmed"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
markers = ["slow: tests that take more than a few seconds"]
testpaths = ["tests"]
